default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: datahound_development

test:
  <<: *default
  database: datahound_test

production:
  primary: &primary_production
    <<: *default
    database: datahound_production
    username: datahound
    password: <%= ENV["DATAHOUND_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: datahound_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: datahound_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: datahound_production_cable
    migrations_paths: db/cable_migrate
