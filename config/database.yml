default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV["DB_HOST"] %>
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>

development:
  primary:
    <<: *default
    database: datahound_development
  cache:
    <<: *default
    database: datahound_development_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: datahound_development_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: datahound_development_cable
    migrations_paths: db/cable_migrate

test:
  primary:
    <<: *default
    database: datahound_test
  cache:
    <<: *default
    database: datahound_test_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: datahound_test_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: datahound_test_cable
    migrations_paths: db/cable_migrate

production:
  primary: &primary_production
    <<: *default
    database: datahound_production
    username: datahound
    password: <%= ENV["DATAHOUND_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: datahound_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: datahound_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: datahound_production_cable
    migrations_paths: db/cable_migrate
