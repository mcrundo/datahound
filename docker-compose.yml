services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: datahound
      POSTGRES_PASSWORD: password
      POSTGRES_DB: datahound_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U datahound
      interval: 2s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: bin/rails server -b 0.0.0.0
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://datahound:password@db:5432/datahound_development
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle

  worker:
    build: .
    command: bin/jobs
    environment:
      DATABASE_URL: postgres://datahound:password@db:5432/datahound_development
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle

volumes:
  postgres_data:
  bundle_cache:
