services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: datahound
      POSTGRES_PASSWORD: password
      POSTGRES_DB: datahound_production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U datahound
      interval: 2s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: bash -c "bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    environment: &app_env
      DB_HOST: db
      DB_USERNAME: datahound
      DB_PASSWORD: password
      DATAHOUND_DATABASE_PASSWORD: password
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      SECRET_KEY_BASE: placeholder_for_docker_compose_dev
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:3000/up || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build: .
    command: bin/jobs
    environment:
      <<: *app_env
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
